<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Profile Control Tool Icon - OpenGlider -->
<svg
   xmlns="http://www.w3.org/2000/svg"
   width="64px"
   height="64px"
   viewBox="0 0 64 64">
  <defs>
    <linearGradient id="profileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0079ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ccff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <g id="layer1">
    <!-- Airfoil profile shape -->
    <path
       style="fill:none;stroke:#333333;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"
       d="M 4,32 C 10,24 22,18 40,28 C 52,34 58,36 60,34 C 58,42 48,46 34,42 C 18,37 8,38 4,32 z"
       id="airfoil" />
    <!-- Thickness variation curve -->
    <path
       style="fill:none;stroke:url(#profileGrad);stroke-width:3;stroke-linecap:round"
       d="M 4,52 C 16,48 32,56 48,50 C 56,46 60,52 60,52"
       id="thicknessCurve" />
    <!-- Control points -->
    <circle cx="4" cy="52" r="3" fill="#0079ff" />
    <circle cx="32" cy="56" r="3" fill="#0079ff" />
    <circle cx="60" cy="52" r="3" fill="#0079ff" />
    <!-- Tabs indicator (small rectangles at top) -->
    <rect x="6" y="4" width="10" height="6" rx="1" fill="#0079ff" opacity="0.8" />
    <rect x="18" y="4" width="10" height="6" rx="1" fill="#00aaff" opacity="0.6" />
    <rect x="30" y="4" width="10" height="6" rx="1" fill="#00ccff" opacity="0.5" />
    <rect x="42" y="4" width="10" height="6" rx="1" fill="#00ddff" opacity="0.4" />
    <rect x="54" y="4" width="8" height="6" rx="1" fill="#00eeff" opacity="0.3" />
  </g>
</svg>
